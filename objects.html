<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Objetos - Stack QR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/objects.js" defer></script>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" >
        <div class="container d-flex justify-content-between align-items-center" style="height: 50px;">
            <button class="btn btn-primary ms-2 me-2" onclick="goBack()">
                <i class="bi bi-arrow-left"></i>
            </button>

            <!-- Contenedor de búsqueda y opciones -->
            <div class="d-flex align-items-center">
                <button id="toggleSearch" class="btn btn-primary me-2">
                    <i class="bi bi-search"></i>
                </button>

                <input type="text" id="searchBar" class="form-control search-hidden" placeholder="Buscar inventario">
                
                <div class="dropdown ms-2">
                    <button class="btn btn-primary dropdown-toggle" type="button" id="optionsMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-list"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="optionsMenu">
                        <li><a class="dropdown-item" href="pages/tags.html">Etiquetas</a></li>
                        <li><a class="dropdown-item" href="pages/attributes.html">Atributos</a></li>
                    </ul>
                </div>

                
            </div>
        </div>
    </nav>

    <!-- Contenedor de Objetos -->
    <div class="container mt-4">
        <h2 class="text-center header-objects" id="inventoryHeader">Lista de Objetos</h2>
        <br>
        <div class="row" id="objectsList">
            <!-- Objetos cargados dinámicamente -->
        </div>
    </div>

    <!-- Botón flotante para agregar objeto -->
    <button class="floating-button" data-bs-toggle="modal" data-bs-target="#addObjectModal"><i class="bi bi-plus-lg"></i></button>

    <!-- Modal para agregar objeto -->
    <div class="modal fade" id="addObjectModal" tabindex="-1" aria-labelledby="addObjectModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addObjectModalLabel">Agregar Objeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="objectForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="objectName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="objectName" required>
                        </div>
                        <div class="mb-3">
                            <label for="objectQuantity" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="objectQuantity" required>
                        </div>
                        <div class="mb-3">
                            <label for="objectTypeQR" class="form-label">Tipo de QR</label>
                            <select class="form-control" id="objectTypeQR">
                                <option value="único">Único</option>
                                <option value="compartido">Compartido</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="objectImage" class="form-label">Imagen</label>
                            <input type="file" class="form-control" id="objectImage">
                        </div>

                        <!-- Sección de Atributos -->
                        <h5 class="mt-3">Atributos</h5>
                        <div class="mb-3 d-flex align-items-center">
                            <select class="form-control me-2" id="attributeSelect"></select>
                            <input type="text" class="form-control me-2" id="attributeValue" placeholder="Valor del atributo">
                            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newAttributeModal"><i class="bi bi-plus"></i></button>
                        </div>
                        <button type="button" class="btn btn-primary mt-2" onclick="addAttribute()">Añadir Atributo</button>
                        <ul class="list-group mt-2" id="attributesList"></ul>

                        <!-- Sección de Etiquetas -->
                        <h5 class="mt-4">Etiquetas</h5>
                        <div class="mb-3 d-flex align-items-center">
                            <select class="form-control me-2" id="tagSelect"></select>
                            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newTagModal"><i class="bi bi-plus"></i></button>
                        </div>
                        <button type="button" class="btn btn-primary mt-2" onclick="addTag()">Añadir Etiqueta</button>
                        <ul class="list-group mt-2" id="tagsList"></ul>

                        <button type="submit" class="btn btn-primary mt-3">Guardar Objeto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar objeto -->
    <div class="modal fade" id="editObjectModal" tabindex="-1" aria-labelledby="editObjectModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editObjectModalLabel">Editar Objeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editObjectForm">
                        <input type="hidden" id="editObjectId">
                        
                        <div class="mb-3">
                            <label for="editObjectName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editObjectName" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="editObjectQuantity" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="editObjectQuantity" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="editObjectTypeQR" class="form-label">Tipo de QR</label>
                            <select class="form-control" id="editObjectTypeQR">
                                <option value="único">Único</option>
                                <option value="compartido">Compartido</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="editObjectImage" class="form-label">Imagen (Opcional)</label>
                            <input type="file" class="form-control" id="editObjectImage">
                        </div>

                        <!-- Sección de Atributos -->
                        <h5>Atributos</h5>
                        <div id="editAttributesList" class="mb-3"></div>
                        <div class="d-flex">
                            <select id="editAttributeSelect" class="form-control me-2"></select>
                            <input type="text" id="editAttributeValue" class="form-control me-2" placeholder="Valor">
                            <button type="button" class="btn btn-success" onclick="handleAddAttributeToEdit()">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>

                        <!-- Sección de Etiquetas -->
                        <h5 class="mt-3">Etiquetas</h5>
                        <div id="editTagsList" class="mb-3"></div>
                        <div class="d-flex">
                            <select id="editTagSelect" class="form-control me-2"></select>
                            <button type="button" class="btn btn-success" onclick="handleAddTagToEdit()">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>


                        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear un nuevo atributo -->
    <div class="modal fade" id="newAttributeModal" tabindex="-1" aria-labelledby="newAttributeModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newAttributeModalLabel">Crear Nuevo Atributo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newAttributeForm">
                        <div class="mb-3">
                            <label for="newAttributeName" class="form-label">Nombre del Atributo</label>
                            <input type="text" class="form-control" id="newAttributeName">
                        </div>
                        <button type="button" class="btn btn-success" onclick="createNewAttribute()">Crear Atributo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear una nueva etiqueta -->
    <div class="modal fade" id="newTagModal" tabindex="-1" aria-labelledby="newTagModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newTagModalLabel">Crear Nueva Etiqueta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newTagForm">
                        <div class="mb-3">
                            <label for="newTagName" class="form-label">Nombre de la Etiqueta</label>
                            <input type="text" class="form-control" id="newTagName">
                        </div>
                        <button type="button" class="btn btn-success" onclick="createNewTag()">Crear Etiqueta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
