<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Stack QR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/api.js" defer></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Logo y Nombre -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="img/logo.png" width="40" height="40" class="me-2">
                <span></span>
            </a>
    
            <!-- Contenedor de búsqueda y QR -->
            <div class="d-flex align-items-center">
                <!-- Botón de búsqueda -->
                <button id="toggleSearch" class="btn btn-primary me-2">
                    <i class="bi bi-search"></i>
                </button>
    
                <!-- Barra de búsqueda oculta -->
                <input type="text" id="searchBar" class="form-control search-hidden" placeholder="Buscar inventario">
    
                <!-- Botón de escaneo QR -->
                <button id="scanQR" class="btn btn-primary ms-2">
                    <a href="scanner.html" class="text-white text-decoration-none">
                        <i class="bi bi-qr-code-scan"></i>
                    </a>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Contenedor de Inventarios -->
    <div class="container mt-4">
        <h2 class="text-center">Lista de Inventarios</h2>
        <br>
        <div class="row" id="inventoryList">
            <!-- Inventarios cargados dinámicamente -->
        </div>
    </div>

    <!-- Botón flotante para agregar inventario -->
    <button class="floating-button" data-bs-toggle="modal" data-bs-target="#addInventoryModal"><i class="bi bi-plus-lg"></i></button>

    <!-- Modal para agregar inventario -->
    <div class="modal fade" id="addInventoryModal" tabindex="-1" aria-labelledby="addInventoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addInventoryModalLabel">Agregar Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="inventoryForm">
                        <div class="mb-3">
                            <label for="inventoryName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="inventoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="inventoryDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="inventoryDescription" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar inventario -->
    <div class="modal fade" id="editInventoryModal" tabindex="-1" aria-labelledby="editInventoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editInventoryModalLabel">Editar Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editInventoryForm">
                        <input type="hidden" id="editInventoryId"> <!-- ID oculto del inventario -->
                        <div class="mb-3">
                            <label for="editInventoryName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editInventoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editInventoryDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="editInventoryDescription" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
