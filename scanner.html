<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escaner del documento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" defer></script>

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" >
        <div class="container d-flex justify-content-between align-items-center" style="height: 50px;">
            <button class="btn btn-primary ms-2 me-2" onclick="goBack()">
                <i class="bi bi-arrow-left"></i>
            </button>
        </div>
    </nav>

    <!-- Contenedor del scanner -->
    <div class="container mt-5 text-center">
        <h2>Escanear Código QR</h2>
        
        <!-- Botón para activar el escáner -->
        <div id="scanButtonContainer">
            <button id="scanButton" class="btn btn-primary btn-lg">
                <i class="bi bi-qr-code-scan"></i> Escanear QR
            </button>
        </div>
    
        <!-- Área del lector de QR (inicialmente oculta) -->
        <div id="readerContainer" class="d-none">
            <div id="reader" class="scanner-box"></div>
            <button id="closeScanner" class="btn btn-danger mt-3">Cerrar</button>
        </div>
    
        <p id="result" class="mt-3"></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/scanner.js" defer></script>
</body>
</html>
